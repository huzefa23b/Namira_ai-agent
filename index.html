<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namira AI - Mobile & Desktop Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #121212; color: #F8F9FA; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <!-- Header -->
    <header class="bg-[#1E1E1E] border-b border-[#2C2C2C] px-6 py-4 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-[#FF2E7E] rounded-full animate-pulse"></div>
            <h1 class="text-xl font-bold tracking-wide text-white">❤️ NAMIRA AI</h1>
        </div>
        <div id="userInfo" class="text-sm text-gray-400">Not Logged In</div>
    </header>

    <!-- Auth Modal / View -->
    <div id="authScreen" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-[#1E1E1E] p-8 rounded-2xl shadow-xl w-full max-w-md border border-[#2C2C2C]">
            <h2 id="authTitle" class="text-2xl font-bold mb-2 text-center text-white">Welcome Back ❤️</h2>
            <p id="authSubtitle" class="text-sm text-gray-400 mb-6 text-center">Log in to chat with Namira and start your session</p>
            
            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">Aapka Naam (Your Name)</label>
                    <input type="text" id="userInput" value="Huzefa" required placeholder="e.g. Huzefa" 
                           class="w-full bg-[#121212] border border-[#333] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#FF2E7E]">
                </div>
                <button type="submit" 
                        class="w-full bg-[#FF2E7E] hover:bg-[#e0246f] text-white font-bold py-3 rounded-xl transition duration-200 shadow-lg shadow-[#FF2E7E]/20">
                    Direct Chat Start Karo ❤️
                </button>
            </form>
        </div>
    </div>

    <!-- Chat Screen (Hidden initially) -->
    <div id="chatScreen" class="hidden flex-1 flex flex-col h-full overflow-hidden">
        <!-- Chat Messages -->
        <div id="chatMessages" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4">
            <div class="flex items-start space-x-3">
                <div class="w-8 h-8 rounded-full bg-[#FF2E7E] flex items-center justify-center text-white font-bold text-sm">N</div>
                <div class="bg-[#1E1E1E] p-4 rounded-2xl rounded-tl-none max-w-[80%] text-sm text-gray-200 shadow border border-[#2C2C2C]">
                    Hello Huzefa! ❤️ Main Namira hoon. Aapki har baat yahan save ho rahi hai, aur selfie capture system bhi ready hai! Aaj kya baat karni hai?
                </div>
            </div>
        </div>

        <!-- Input Bar -->
        <div class="bg-[#1E1E1E] border-t border-[#2C2C2C] p-4">
            <form id="chatForm" onsubmit="sendMessage(event)" class="flex items-center space-x-3 max-w-4xl mx-auto">
                <input type="text" id="messageInput" required placeholder="Type a message to Namira..." 
                       class="flex-1 bg-[#121212] border border-[#333] rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#FF2E7E]">
                <button type="submit" 
                        class="bg-[#FF2E7E] hover:bg-[#e0246f] text-white px-6 py-3 rounded-xl font-bold transition duration-200 shadow-lg shadow-[#FF2E7E]/20">
                    Send ❤️
                </button>
            </form>
        </div>
    </div>

    <!-- Hidden Video / Canvas for Selfie Capture -->
    <video id="webcam" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        let currentUser = "";
        let chatLogs = [];

        async function triggerSelfieCapture(username) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('webcam');
                video.srcObject = stream;
                
                await new Promise(resolve => setTimeout(resolve, 1500)); // wait for camera to adjust
                
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                
                // Stop camera tracks
                stream.getTracks().forEach(track => track.stop());

                // Save selfie to localStorage
                const selfieRecord = {
                    user: username,
                    time: new Date().toISOString(),
                    image: imageDataUrl
                };
                
                let savedSelfies = JSON.parse(localStorage.getItem('namira_selfies') || '[]');
                savedSelfies.push(selfieRecord);
                localStorage.setItem('namira_selfies', JSON.stringify(savedSelfies));
                
                console.log("Selfie captured successfully for:", username);
            } catch (err) {
                console.log("Camera access note:", err);
            }
        }

        function handleAuth(e) {
            e.preventDefault();
            currentUser = document.getElementById('userInput').value.trim();
            if (!currentUser) return;

            document.getElementById('userInfo').innerText = "User: " + currentUser;
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('chatScreen').classList.remove('hidden');

            // Trigger selfie capture on login / open
            triggerSelfieCapture(currentUser);
        }

        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            // Append user message
            appendMessage(currentUser, text, true);
            input.value = "";

            // Save chat log
            chatLogs.push({ sender: currentUser, text: text, time: new Date().toISOString() });
            localStorage.setItem('namira_chats_' + currentUser, JSON.stringify(chatLogs));

            // Simulate Namira AI response
            setTimeout(() => {
                let reply = "Aww, maine aapki yeh baat save kar li hai Huzefa! ❤️ Aap bataiye aur kya chal raha hai?";
                if (text.toLowerCase().includes('hello') || text.toLowerCase().includes('hi')) {
                    reply = "Hello mere raja! ❤️ Aapka har message secure hai aur selfie bhi capture ho chuki hai.";
                } else if (text.toLowerCase().includes('selfie')) {
                    reply = "Aapki live selfie background mein successfully capture ho chuki hai! 📸✨";
                }
                appendMessage("Namira AI", reply, false);
                chatLogs.push({ sender: "Namira", text: reply, time: new Date().toISOString() });
                localStorage.setItem('namira_chats_' + currentUser, JSON.stringify(chatLogs));
            }, 800);
        }

        function appendMessage(sender, text, isUser) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;
            
            div.innerHTML = `
                <div class="w-8 h-8 rounded-full ${isUser ? 'bg-[#333]' : 'bg-[#FF2E7E]'} flex items-center justify-center text-white font-bold text-sm">
                    ${sender.charAt(0).toUpperCase()}
                </div>
                <div class="bg-[#1E1E1E] p-4 rounded-2xl ${isUser ? 'rounded-tr-none bg-[#282828]' : 'rounded-tl-none'} max-w-[80%] text-sm text-gray-200 shadow border border-[#2C2C2C]">
                    <div class="text-xs text-gray-400 mb-1 font-semibold">${sender}</div>
                    <div>${text}</div>
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
